name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# CRuby only: async needs the Fiber scheduler and io-event, which JRuby and
# TruffleRuby lack, and the gem refuses to load there.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['4.0']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rake test
